<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b3eea"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="248" y="320" width="528" height="440" rx="48" fill="none" stroke="white" stroke-width="44"/>
  <!-- Calendar top bar -->
  <rect x="248" y="320" width="528" height="140" rx="48" fill="white" opacity="0.2"/>
  <!-- Calendar grid lines -->
  <line x1="248" y1="460" x2="776" y2="460" stroke="white" stroke-width="44" opacity="0.2"/>
  <!-- Hook pegs -->
  <line x1="380" y1="248" x2="380" y2="370" stroke="white" stroke-width="44" stroke-linecap="round"/>
  <line x1="644" y1="248" x2="644" y2="370" stroke="white" stroke-width="44" stroke-linecap="round"/>
  <!-- Checkmark -->
  <polyline points="370,560 468,660 654,500" fill="none" stroke="white" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
